<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RL 2D - Rocket League</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:linear-gradient(135deg,#1e3a8a,#166534);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.caixa-login{background:#1e293b;padding:40px 30px;border-radius:12px;border:2px solid #475569;text-align:center;max-width:400px;width:90%}
h1{font-size:28px;margin-bottom:8px;color:#f97316}
p{color:#94a3b8;margin-bottom:30px}
input{width:100%;padding:14px;font-size:16px;border:2px solid #475569;border-radius:8px;background:#0f172a;color:#fff;margin-bottom:15px}
input:focus{outline:none;border-color:#f97316}
button{width:100%;padding:14px;font-size:16px;font-weight:bold;border:none;border-radius:8px;cursor:pointer;transition:.2s}
button:hover{transform:scale(1.02)}
.btn-entrar{background:#f97316;color:#fff}
.btn-entrar:hover{background:#ea580c}
.erro{color:#fca5a5;margin-bottom:10px;min-height:22px}
.tela-principal{display:none;padding:30px;text-align:center;width:100vw;height:100vh;background:linear-gradient(135deg,#1e3a8a,#166534)}
.tela-principal.ativa{display:block}
</style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="tela-login" class="caixa-login">
<h1>🚀 ROCKET LEAGUE 2D</h1>
<p>Clone 2D · Visão Lateral</p>
<input type="text" id="meu-nome" placeholder="Digite seu nome...">
<div id="mensagem-erro" class="erro"></div>
<button id="botao-entrar" class="btn-entrar">ENTRAR</button>
</div>

<!-- TELA DEPOIS DE ENTRAR -->
<div id="tela-interna" class="tela-principal">
<h2>Bem-vindo, <span id="mostra-nome"></span>! 🎉</h2>
<p style="margin-top:20px;color:#fff">Você entrou com sucesso!</p>
<button style="max-width:200px;margin-top:30px;background:#ef4444" onclick="sair()">SAIR</button>
</div>

<script>
// PEGA OS ELEMENTOS
const botaoEntrar = document.getElementById('botao-entrar');
const campoNome = document.getElementById('meu-nome');
const mensagemErro = document.getElementById('mensagem-erro');
const telaLogin = document.getElementById('tela-login');
const telaInterna = document.getElementById('tela-interna');
const mostraNome = document.getElementById('mostra-nome');

// FUNÇÃO DE ENTRAR
botaoEntrar.addEventListener('click', function() {
    const nome = campoNome.value.trim();
    
    if (nome === '') {
        mensagemErro.textContent = '⚠️ Por favor, digite seu nome!';
        return;
    }
    
    // ENTRA!
    mostraNome.textContent = nome;
    telaLogin.style.display = 'none';
    telaInterna.classList.add('ativa');
});

// TAMBÉM FUNCIONA APERTANDO ENTER
campoNome.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') botaoEntrar.click();
});

function sair() {
    telaInterna.classList.remove('ativa');
    telaLogin.style.display = 'block';
    campoNome.value = '';
    mensagemErro.textContent = '';
}
</script>

</body>
</html>
